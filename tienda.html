<style>

.userbar .ub-user {

.userbar .ub-balance {

.userbar .ub-balance .bal-amount {

.userbar .ub-currency {

.userbar .ub-btn {

.userbar .ub-btn-recharge {
  background: linear-gradient(135deg, #10b981, #059669);

.userbar .ub-btn-recharge:hover {

.userbar .ub-btn-panel {

.userbar .ub-btn-panel:hover {

.userbar .ub-btn-admin {

}

.userbar .ub-btn-admin:hover {

.userbar .ub-btn-owner {
  background: linear-gradient(135deg, #00d9ff, #0091b8);
  color: #04212b;

}

.userbar .ub-btn-owner:hover {

  box-shadow: 0 6px 16px rgba(0, 217, 255, 0.5);
}

.userbar .ub-btn-ghost {

}

.userbar .ub-btn-ghost:hover {

  color: #ffffff;
}

.userbar .ub-btn-primary {
  background: linear-gradient(135deg, #00b4d8, #00d9ff);
  color: #020a10;

}

.userbar .ub-btn-primary:hover {
  transform: translateY(-1px);

}

.userbar .ub-sep {

  height: 24px;

#productos {
  position: relative;
  z-index: 5;
}

#publicProducts {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 20px;
  align-items: stretch;
  width: 100%;
}

#publicProducts .product-card {
  position: relative;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  border-radius: 20px;
  background: linear-gradient(145deg, #0a1a24, #061218);
  border: 2px solid transparent;
  transition: transform 0.25s ease, box-shadow 0.25s ease;
}

#publicProducts .product-card::before {
  content: "";
  position: absolute;
  inset: -2px;
  border-radius: 22px;
  background: linear-gradient(135deg, #00d9ff, #020a10, #00d9ff);
  z-index: -1;
  opacity: 0.4;
  transition: opacity 0.25s;
}

#publicProducts .product-card:hover {
  transform: translateY(-5px);
  box-shadow: 0 12px 30px rgba(0, 217, 255, 0.15);
}

#publicProducts .product-card:hover::before {
  opacity: 0.8;
}

#publicProducts .product-card .thumb {
  position: relative;
  width: 100%;
  height: 180px;
  overflow: hidden;
  display: grid;
  place-items: center;
  background: #0b0614;
}

#publicProducts .product-card .thumb img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

#publicProducts .product-card .thumb::after {
  content: "";
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  height: 60px;
  background: linear-gradient(transparent, #0a1a24);
}

#publicProducts .p-info {
  padding: 14px 16px 0;
}

#publicProducts .p-name {
  font-size: 16px;
  font-weight: 800;
  color: #ffffff;
  margin-bottom: 8px;
}

#publicProducts .p-online {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 4px 12px;
  border-radius: 20px;
  font-size: 11px;
  font-weight: 700;
  background: rgba(16, 185, 129, 0.15);
  color: #10b981;
  margin-bottom: 10px;
}

#publicProducts .p-online::before {
  content: "";
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: #10b981;
  box-shadow: 0 0 6px #10b981;
}

#publicProducts .p-provider {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 12px;
  color: #6a8a9a;
  margin-bottom: 12px;
}

#publicProducts .p-desc {
  font-size: 12px;
  color: #5a7a8a;
  padding: 0 16px;
  margin-bottom: 4px;
}

#publicProducts .p-price-section {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px 16px;
  border-top: 1px solid rgba(0, 217, 255, 0.08);
  margin-top: auto;
}

#publicProducts .p-price-box {
  display: flex;
  flex-direction: column;
}

#publicProducts .p-price-label {
  font-size: 10px;
  color: #4a6070;
  text-transform: uppercase;
  letter-spacing: 1px;
  font-weight: 700;
}

#publicProducts .p-price {
  font-size: 22px;
  font-weight: 900;
  color: #00d9ff;
}

#publicProducts .p-stock-box {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
}

#publicProducts .p-stock-label {
  font-size: 9px;
  color: #4a6070;
  text-transform: uppercase;
  letter-spacing: 1px;
  font-weight: 700;
}

#publicProducts .p-stock-circle {
  width: 38px;
  height: 38px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 14px;
  font-weight: 900;
}

#publicProducts .p-stock-circle.ok {
  background: rgba(16, 185, 129, 0.15);
  color: #10b981;
  border: 2px solid rgba(16, 185, 129, 0.3);
}

#publicProducts .p-stock-circle.low {
  background: rgba(245, 158, 11, 0.15);
  color: #f59e0b;
  border: 2px solid rgba(245, 158, 11, 0.3);
}

#publicProducts .p-stock-circle.empty {
  background: rgba(239, 68, 68, 0.15);
  color: #ef4444;
  border: 2px solid rgba(239, 68, 68, 0.3);
}

#publicProducts .p-actions {
  display: flex;
  flex-direction: column;
  gap: 8px;
  padding: 12px 16px 16px;
}

#publicProducts .btn-comprar {
  width: 100%;
  padding: 13px;
  border: none;
  border-radius: 12px;
  font-size: 14px;
  font-weight: 800;
  cursor: pointer;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  transition: all 0.2s;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  text-decoration: none;
}

#publicProducts .btn-comprar.active {
  background: linear-gradient(135deg, #00b4d8, #00d9ff);
  color: #020a10;
  box-shadow: 0 6px 20px rgba(0, 217, 255, 0.3);
}

#publicProducts .btn-comprar.active:hover {
  transform: translateY(-2px);
  box-shadow: 0 10px 28px rgba(0, 217, 255, 0.4);
}

#publicProducts .btn-comprar.disabled {

  color: #ef4444;
  border: 1px solid rgba(239, 68, 68, 0.2);
  cursor: not-allowed;
}

#publicProducts .btn-detalles {
  width: 100%;
  padding: 11px;
  border: 1px solid rgba(0, 217, 255, 0.2);
  border-radius: 12px;
  background: rgba(0, 217, 255, 0.06);
  color: #00d9ff;
  font-size: 13px;
  font-weight: 700;
  cursor: pointer;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  transition: all 0.2s;
  display: flex;
  align-items: center;
  justify-content: center;

}

#publicProducts .btn-detalles:hover {
  background: rgba(0, 217, 255, 0.12);
  border-color: rgba(0, 217, 255, 0.4);
  transform: translateY(-1px);
}

.thumb-badge.agotado {

.thumb-badge.disponible {

}

.thumb-badge.bajo {

}

.thumb-price {
  position: absolute;

  padding: 6px 12px;
  border-radius: 8px;
  background: rgba(0, 217, 255, 0.9);

  font-weight: 900;

.thumb-oferta {

.sv-modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.7);
  backdrop-filter: blur(6px);
  z-index: 9999;
  display: flex;
  align-items: center;
  justify-content: center;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.25s;
  padding: 20px;
}

.sv-modal-overlay.sv-modal-open {
  opacity: 1;
  pointer-events: all;
}

.sv-modal-box {
  background: linear-gradient(145deg, #0a1a24, #061218);
  border: 1px solid #0a2a3a;
  border-radius: 20px;
  width: 100%;
  max-width: 500px;
  max-height: 80vh;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  transform: translateY(20px) scale(0.95);
  transition: transform 0.25s;
  box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5), 0 0 40px rgba(0, 217, 255, 0.08);
}

.sv-modal-open .sv-modal-box {
  transform: translateY(0) scale(1);
}

.sv-modal-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 20px 24px;
  border-bottom: 1px solid #0a2a3a;
}

.sv-modal-header h3 {
  margin: 0;
  color: #ffffff;
  font-size: 18px;
  font-weight: 700;
}

.sv-modal-close {
  width: 36px;
  height: 36px;
  border-radius: 10px;
  border: 1px solid #0a2a3a;
  background: rgba(239, 68, 68, 0.1);
  color: #ef4444;
  font-size: 16px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.2s;
}

.sv-modal-close:hover {
  background: rgba(239, 68, 68, 0.2);
  border-color: rgba(239, 68, 68, 0.4);
}

.sv-modal-body {
  padding: 24px;
  overflow-y: auto;
}

@media (max-width: 900px) {
  #publicProducts {
    grid-template-columns: repeat(2, minmax(240px, 1fr));
  }
}

@media (max-width: 600px) {
  #publicProducts {
    grid-template-columns: 1fr;
  }

<body>


<!-- ==================================================
     BARRA SUPERIOR
================================================== -->

<header class="topbar">

  <a
    class="brand"
    href="tienda.html"
  >

    <b>S</b>

    Engranajes del Dragón

  </a>


  <div
    class="userbar"
    id="indexUserbar"
  ></div>

</header>



<!-- ==================================================
     CONTENIDO
================================================== -->

<main>


<!-- ==================================================
     HERO
================================================== -->

<section class="hero container">

  <div>

    <span class="eyebrow">
      CATÁLOGO DE SERVICIOS
    </span>


    <h1>
      Tu tienda de
      <span>streaming</span>
    </h1>


    <p>
      Compra tus accesos de forma rápida
      y gestiona tus pedidos desde tu cuenta.
    </p>

  </div>



</section>


<!-- ==================================================
     PRODUCTOS
================================================== -->

<section
  id="productos"
  class="container section"
>


  <div class="section-head">

    <div>

      <span class="eyebrow">
        OFERTAS
      </span>


      <h2>
        Productos disponibles
      </h2>

    </div>


    <span
      id="summary"
      class="muted"
    ></span>

  </div>

    id="publicProducts"
    class="product-grid"
  ></div>

</main>



<!-- ==================================================
     FOOTER
================================================== -->

<footer class="footer">

  © 2026 Engranajes del Dragón · Tienda virtual

</footer>



<!-- ==================================================
     APP.JS
================================================== -->

<script src="js/app.js"></script>



<script>

/* =========================================================
   INICIALIZAR SISTEMA
========================================================= */

SV.seed();

if (SV.session() && SV.isSuspended(SV.session())) {
  SV.logout();
  location.href = "index.html";
}



/* =========================================================
   BARRA SUPERIOR DINÁMICA
========================================================= */

const indexUserbar =
  document.getElementById(
    "indexUserbar"
  );

const usuarioActual =
  SV.session();


if (
  usuarioActual &&
  usuarioActual.trim() !== ""
) {

  const balances = { PEN: 0, MXN: 0, USD: 0 };
  const saved = SV.getBalance(usuarioActual);
  if (typeof saved === "object" && saved !== null) {
    balances.PEN = Number(saved.PEN || 0);
    balances.MXN = Number(saved.MXN || 0);
    balances.USD = Number(saved.USD || 0);
  } else {
    balances.PEN = Number(saved || 0);
  }

  const userData = SV.currentUser();
  const canPanel = !!userData && userData.role === "proveedor";
  const canAdmin = !!userData && userData.role === "admin";
  const canOwner = !!userData && userData.role === "dueno";

  indexUserbar.innerHTML = `

    <span class="ub-user">
      <i class="fa-solid fa-user"></i>
      ${SV.escapeHtml(usuarioActual)}
    </span>

    <span class="ub-sep"></span>

    <span class="ub-balance">
      <i class="fa-solid fa-wallet"></i>
      <span class="bal-amount" id="ubBalAmount">${balances.PEN.toFixed(2)} créditos</span>
    </span>

    <select class="ub-currency" id="ubCurrency">
      <option value="PEN">Cartera PEN</option>
      <option value="MXN">Cartera MXN</option>
      <option value="USD">Cartera USD</option>
    </select>

    ${canAdmin ? `
    <a class="ub-btn ub-btn-admin" href="admin.html" title="Panel principal del dueño">
      <i class="fa-solid fa-gauge-high"></i>
      Panel principal
    </a>` : ""}

    ${canOwner ? `
    <a class="ub-btn ub-btn-owner" href="admin.html" title="Panel oficial de dueño">
      <i class="fa-solid fa-crown"></i>
      Panel oficial
    </a>` : ""}

    ${canPanel ? `
    <a class="ub-btn ub-btn-panel" href="admin.html" title="Panel de proveedor">
      <i class="fa-solid fa-store"></i>
      Mi panel
    </a>` : ""}

    <a class="ub-btn ub-btn-recharge" href="recargas.html">
      <i class="fa-solid fa-plus"></i>
      Recargar créditos
    </a>

    <button
      type="button"
      class="ub-btn ub-btn-ghost"
      id="indexLogout"
    >
      <i class="fa-solid fa-right-from-bracket"></i>
      Salir
    </button>

  `;

  const rates = { PEN: 1, MXN: 4.2, USD: 3.36 };

  document.getElementById("ubCurrency").onchange = function() {
    const cur = this.value;
    const creditos = (balances[cur] || 0) * (rates[cur] || 1);
    document.getElementById("ubBalAmount").textContent = creditos.toFixed(2) + " créditos";
  };

  const monedaActiva = ["PEN", "USD", "MXN"].find(c => Number(balances[c]) > 0) || "PEN";
  const selMoneda = document.getElementById("ubCurrency");
  selMoneda.value = monedaActiva;
  selMoneda.dispatchEvent(new Event("change"));

  document
    .getElementById("indexLogout")
    .onclick = function () {
      SV.logout();
      location.href = "index.html";
    };

} else {

  indexUserbar.innerHTML = `

    <a class="ub-btn ub-btn-ghost" href="#productos">
      <i class="fa-solid fa-store"></i>
      Productos
    </a>

    <a class="ub-btn ub-btn-ghost" href="index.html">
      <i class="fa-solid fa-right-to-bracket"></i>
      Iniciar sesión
    </a>

    <a class="ub-btn ub-btn-primary" href="index.html">
      <i class="fa-solid fa-cart-shopping"></i>
      Comprar acceso
    </a>

  `;

}



/* =========================================================
   MOSTRAR PRODUCTOS
========================================================= */

SV.renderPublicProducts(
  document.getElementById(
    "publicProducts"
  )
);



/* =========================================================
   RESUMEN DE STOCK
========================================================= */

document.getElementById(
  "summary"
).textContent =

  SV.products()
    .filter(
      product =>
        Number(product.stock || 0) > 0
    )
    .length

  + " productos con stock";



/* ACTUALIZA LA TIENDA SI LOS DATOS CAMBIAN (otra pestaña o panel) */
function refreshStore() {
  SV.renderPublicProducts(
    document.getElementById("publicProducts")
  );
  const summaryEl = document.getElementById("summary");
  if (summaryEl) {
    summaryEl.textContent =
      SV.products().filter(p => Number(p.stock || 0) > 0).length +
      " productos con stock";
  }
}

window.addEventListener("storage", function (e) {
  if (e.key && e.key.indexOf("sv_") === 0) refreshStore();
});

document.addEventListener("visibilitychange", function () {
  if (!document.hidden) refreshStore();
});



document.onkeydown = function(e) {
  if (e.key === "F12") {
    e.preventDefault();
    location.href = "admin.html";
  }
};

</script>



</body>

</html>
